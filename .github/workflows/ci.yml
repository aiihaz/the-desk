name: ci

on:
  push:
    branches: [main, imessage-linq]
  pull_request:

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 3.0.0's release download returns 504 since 8 Nov 2026; 2.122.0 is the CLI that applied
      # 0028-0029 to the hosted project. Back to 3.0.0 once its download works.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # The ubuntu-26.04 image of 2026-11-01 had 54322 taken before Supabase started.
      # Say what holds it, and use a free port for this run.
      - name: Free database port
        run: |
          if ss -ltn | grep -q ':54322 '; then
            sudo ss -ltnp | grep ':54322 ' || true
            sed -i 's/^port = 54322$/port = 55432/' supabase/config.toml
            grep -q '^port = 55432$' supabase/config.toml
          fi
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Guard and limit tests (pgTAP)
        run: supabase test db
      - name: Database concurrency
        run: python3 scripts/test_db_concurrency.py

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Format, lint, type-check
        run: deno task check
      - name: Unit tests
        run: deno task test
      - name: Local bench safety
        run: deno task test:bench
      - name: Internal endpoint authorization
        run: deno task test:auth
