name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Guard and limit tests (pgTAP)
        run: supabase test db

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format, lint, type-check
        run: deno task check
      - name: Unit tests
        run: deno task test
